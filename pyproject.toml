[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bechdel-detector"
version = "0.1.0"
description = "Bechdel Test Detector: Machine Learning, Statistical Analysis, and Dialogue Detection for Gender Representation in Film"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Senior ML Engineer"}
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
    "shap>=0.42.0",
    "statsmodels>=0.14.0",
    "pyarrow>=12.0.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pytest>=7.4.0",
    "jupyter>=1.0.0",
    "nbconvert>=7.7.0",
    "ipykernel>=6.25.0"
]

[project.scripts]
bechdel = "bechdel.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
